# Pings Render every 5 minutes so free/starter instances do not idle-sleep.
# Set repo secret RENDER_HEALTH_URL = https://<your-service>.onrender.com/health
name: Keep Render warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping /health
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HEALTH_URL}" ]; then
            echo "Missing secret RENDER_HEALTH_URL"
            echo "Example: https://your-service.onrender.com/health"
            exit 1
          fi
          echo "Pinging health endpoint"
          for i in 1 2 3; do
            if curl -fsS --max-time 45 -H 'Cache-Control: no-cache' "$HEALTH_URL"; then
              echo
              echo "ok (attempt $i)"
              exit 0
            fi
            echo "attempt $i failed; retrying..."
            sleep 5
          done
          echo "health check failed after retries"
          exit 1
