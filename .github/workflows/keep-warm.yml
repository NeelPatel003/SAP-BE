# Keep Render free instances awake by pinging /health.
# Set HEALTH_URL below to your live BE health endpoint (manual — no GitHub secret required).
name: Keep Render warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # >>> EDIT THIS to your Render URL (no trailing slash before /health) <<<
  HEALTH_URL: https://REPLACE-WITH-YOUR-SERVICE.onrender.com/health

jobs:
  ping:
    name: Ping Render /health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 1 — Show run info
        run: |
          echo "Workflow: Keep Render warm"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Branch/ref: ${{ github.ref }}"
          echo "Time (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: 2 — Check HEALTH_URL
        run: |
          if [ -z "${HEALTH_URL}" ] || echo "${HEALTH_URL}" | grep -q 'REPLACE-WITH-YOUR-SERVICE'; then
            echo "::error::Set HEALTH_URL in .github/workflows/keep-warm.yml"
            echo "Example: https://sap-be-xxxx.onrender.com/health"
            exit 1
          fi
          echo "Pinging: ${HEALTH_URL}"

      - name: 3 — Ping /health (retry x3)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "Attempt $i…"
            if body=$(curl -fsS --max-time 60 -H 'Cache-Control: no-cache' "$HEALTH_URL"); then
              echo "Response: $body"
              echo "ok (attempt $i)"
              exit 0
            fi
            echo "attempt $i failed; waiting 8s…"
            sleep 8
          done
          echo "::error::Health check failed after 3 attempts"
          exit 1
