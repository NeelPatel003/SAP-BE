# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sap-be
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: COOKIE_SECURE
        value: "true"
      - key: EMAIL_PROVIDER
        value: log
      - key: EMAIL_FROM
        value: noreply@teamora.app
      - key: ENABLE_SWAGGER
        value: "false"
